name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Generated theme files are in sync
        run: pnpm themes:check

      - name: Theme audit (WCAG contrast)
        run: pnpm themes:audit --strict

      - name: Registry items are in sync
        run: |
          pnpm registry:build
          git diff --exit-code -- apps/web/public/r

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
