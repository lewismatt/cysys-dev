packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: false

# Security overrides. Remove each once upstream ships the fix.
overrides:
  # GHSA-g3hv-75wg-m249 (minimatch < 11.0.1, globParts DoS). shadcn 4.23 pins
  # ts-morph ^26 -> @ts-morph/common 0.27 -> minimatch ^10. ts-morph only calls
  # minimatch(path, pattern), unchanged in v11. Drop when shadcn moves to
  # ts-morph >= 28 (@ts-morph/common 0.29 depends on minimatch ^11.0.1).
  "@ts-morph/common>minimatch": "^11.0.1"
