<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cynerdyne · Eldora Night</title>
    <!-- Apply stored mode/theme before first paint (mirrors themeInitScript()
         in @cysys/ui/providers/theme-provider). -->
    <script>
      ;(function () {
        try {
          var d = document.documentElement
          var m = localStorage.getItem("cysys-mode") || "dark"
          if (m === "system")
            m = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
          d.classList.add(m)
          d.style.colorScheme = m
          var t = localStorage.getItem("cysys-theme")
          if (t) d.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
